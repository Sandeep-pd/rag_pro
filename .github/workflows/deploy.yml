name: Deploy RAG API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t sandeep0030/rag_pro:latest .

      - name: Push Docker image
        run: |
          docker push sandeep0030/rag_pro:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sandeep0030/rag_pro:latest

            docker stop rag_pro || true
            docker rm rag_pro || true

            docker run -d \
              --name rag_pro \
              -p 8003:8003 \
              --env-file /home/ec2-user/.env \
              -v rag_chroma:/app/chroma_db \
              sandeep0030/rag_pro:latest

            docker image prune -f